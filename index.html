<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>THE PATH | Portfolio Edition</title><style>
:root{--bg:#090b12;--panel:rgba(14,18,28,.92);--line:rgba(255,255,255,.12);--text:#f3f5fb;--muted:#9da6ba;--accent:#9b7cff;--good:#69d49a;--warn:#f2c66d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:14px;right:14px;top:14px;display:flex;gap:10px;align-items:flex-start}.brand,.card,.toast,.hint{background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.28);backdrop-filter:blur(12px)}.brand{padding:10px 14px;border-radius:14px;min-width:190px}.brand b{letter-spacing:.18em;font-size:12px}.brand small{display:block;color:var(--muted);margin-top:4px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 10px;border:1px solid var(--line);background:rgba(10,13,20,.78);border-radius:999px;font-size:12px}.bar{display:inline-block;width:62px;height:5px;background:#252b39;border-radius:5px;vertical-align:middle;margin-left:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:50%}.bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:end}.hint{padding:10px 12px;border-radius:12px;color:var(--muted);font-size:12px}.hint kbd{color:#fff;border:1px solid var(--line);padding:2px 6px;border-radius:5px}.actions{display:flex;gap:8px;pointer-events:auto}.btn{border:1px solid var(--line);background:rgba(15,19,30,.92);color:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn:active{transform:scale(.97)}.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:11px 15px;border-radius:12px;opacity:0;transition:.25s;max-width:min(520px,90vw);text-align:center}.toast.show{opacity:1}.panel{position:absolute;right:14px;top:88px;width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;padding:16px;border-radius:16px;display:none;pointer-events:auto}.panel.open{display:block}.panel h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.muted{color:var(--muted)}.joystick{display:none;position:absolute;left:20px;bottom:75px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);pointer-events:auto}.stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:rgba(155,124,255,.65)}@media(max-width:800px){.joystick{display:block}.hint{display:none}.top{flex-direction:column}.brand{min-width:0}.panel{top:150px}.actions{position:absolute;right:0;bottom:0;flex-wrap:wrap;justify-content:end}.btn{padding:10px}.stats{max-width:75vw}.pill{padding:6px 8px;font-size:11px}}
</style><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#090b12"></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="brand"><b>THE PATH</b><small>Live it. Choose it. Become it.</small></div><div class="stats" id="stats"></div></div><div class="panel" id="panel"><h3>Life</h3><div id="panelBody"></div></div><div class="toast" id="toast"></div><div class="bottom"><div class="hint">Move <kbd>WASD</kbd> · Interact <kbd>E</kbd> · Pray <kbd>P</kbd> · Work <kbd>T</kbd> · Study <kbd>R</kbd> · Sleep <kbd>F</kbd> · Menu <kbd>Tab</kbd></div><div class="actions"><button class="btn" id="interactBtn">ACT</button><button class="btn" id="prayBtn">SALAH</button><button class="btn" id="menuBtn">LIFE</button><button class="btn" id="saveBtn">SAVE</button></div></div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div></div><script>
const C=document.getElementById('game'),ctx=C.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Tab'){e.preventDefault();togglePanel()}if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='p')pray();if(e.key.toLowerCase()==='t')work();if(e.key.toLowerCase()==='r')study();if(e.key.toLowerCase()==='f')sleep()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const world={w:2600,h:1800,day:1,hour:5.5,minute:0,season:'Autumn'};let player={x:1300,y:1030,energy:86,health:100,stress:18,discipline:46,knowledge:32,reputation:40,cash:420,debt:1800,prayer:52,trust:35,relationship:38,job:'Delivery Associate'};let camera={x:0,y:0};let message='Fajr is approaching.';let panel=false;let last=performance.now();let autosave=0;
const buildings=[
{x:1160,y:690,w:300,h:190,name:'AL-HUDA MASJID',type:'masjid'},
{x:780,y:760,w:250,h:170,name:'COMMUNITY CENTER',type:'community'},
{x:1580,y:700,w:240,h:180,name:'PUBLIC LIBRARY',type:'library'},
{x:1820,y:1030,w:280,h:190,name:'MARKET',type:'market'},
{x:670,y:1120,w:250,h:190,name:'JOB CENTER',type:'job'},
{x:1530,y:1250,w:280,h:190,name:'COLLEGE',type:'college'},
{x:1030,y:1330,w:260,h:180,name:'CLINIC',type:'clinic'},
{x:1890,y:1400,w:250,h:170,name:'BARBERSHOP',type:'barber'}];
const homes=[];for(let y=430;y<1550;y+=250)for(let x=220;x<2350;x+=330)homes.push({x,y,w:180,h:125,name:'HOME',type:'home'});
const roads=[{x:0,y:910,w:2600,h:130},{x:1240,y:0,w:140,h:1800},{x:420,y:0,w:110,h:1800},{x:2080,y:0,w:110,h:1800}];
const names=['Amina','Yusuf','Bilal','Maryam','Omar','Zainab','Hamza','Hana','Ibrahim','Safiya','Khalid','Noor','Musa','Layla','Imran','Sumayyah','Adam','Fatimah','Idris','Salma','Ismail','Ruqayyah','Tariq','Hafsa'];const jobs=['Teacher','Mechanic','Nurse','Student','Barber','Engineer','Driver','Entrepreneur','Accountant','Organizer'];const npcs=names.map((n,i)=>({name:n,job:jobs[i%jobs.length],x:260+(i*83)%2050,y:360+(i*137)%1200,tx:0,ty:0,speed:18+Math.random()*18,mood:40+Math.random()*50,trust:20+Math.random()*60,home:i%3}));
const trees=[];for(let i=0;i<85;i++)trees.push({x:60+(i*157)%2480,y:80+(i*211)%1650,r:12+(i%5)*2});
function screen(p){return{x:p.x-camera.x,y:p.y-camera.y}}function worldMouse(e){const r=C.getBoundingClientRect();return{x:e.clientX-r.left+camera.x,y:e.clientY-r.top+camera.y}}
C.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){const m=worldMouse(e);player.x=m.x;player.y=m.y}});
function say(t){message=t;const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(say.to);say.to=setTimeout(()=>el.classList.remove('show'),3600)}
function near(type){let best=null,bd=Infinity;for(const b of buildings)if(b.type===type){const d=dist(player,b);if(d<bd)best=b,bd=d}return bd<260?best:null}
function advance(minutes){world.minute+=minutes;while(world.minute>=60){world.minute-=60;world.hour++;}while(world.hour>=24){world.hour-=24;world.day++;world.minute=0;player.energy=clamp(player.energy+25,0,100);player.stress=clamp(player.stress-8,0,100);if(world.day%7===0)say('A new week begins. Jumu’ah will shape Friday.')}player.energy=clamp(player.energy,0,100);player.stress=clamp(player.stress,0,100)}
function timeStr(){let h=Math.floor(world.hour),m=Math.floor(world.minute);let ap=h>=12?'PM':'AM';let hh=((h+11)%12)+1;return `${hh}:${String(m).padStart(2,'0')} ${ap}`}
function prayerName(){const h=world.hour+world.minute/60;if(h<7)return'Fajr';if(h<15.5)return'Dhuhr';if(h<18.5)return'Asr';if(h<20.5)return'Maghrib';return'Isha'}
function pray(){const p=prayerName(),b=near('masjid');const h=world.hour+world.minute/60;const window={Fajr:[4.5,7],Dhuhr:[12,15.5],Asr:[15.5,18.5],Maghrib:[18.5,20.5],Isha:[20.5,24]}[p];if(!b){say('Find a prayer space. The masjid is to the north.');return}if(h>=window[0]&&h<=window[1]){player.prayer=clamp(player.prayer+3,0,100);player.discipline=clamp(player.discipline+1.2,0,100);player.stress=clamp(player.stress-4,0,100);player.energy=clamp(player.energy-2,0,100);player.trust=clamp(player.trust+1,0,100);say(`You prayed ${p}. The masjid is alive around you.`)}else say(`${p} is not due right now. Time still matters.`)}
function work(){const b=near('job');if(!b){say('Go to the Job Center or a workplace to start a shift.');return}if(player.energy<18){say('You are too exhausted to work well.');return}player.cash+=68;player.energy-=22;player.stress+=8;player.reputation+=.4;advance(180);say('You completed a shift. +$68, but your time and energy were spent.')}
function study(){const b=near('library')||near('college')||near('community');if(!b){say('Study at the library, college, or community center.');return}if(player.energy<12){say('Your focus is gone for now.');return}player.knowledge+=2.2;player.discipline+=.6;player.energy-=12;advance(90);say('You studied. Knowledge compounds quietly.')}
function sleep(){const b=near('home');if(!b){say('Find home before you sleep.');return}player.energy=clamp(player.energy+68,0,100);player.stress=clamp(player.stress-24,0,100);advance(420);say('You slept. Morning has its own demands.')}
function interact(){let best=null,bd=Infinity;for(const b of buildings){const d=dist(player,b);if(d<bd)best=b,bd=d}for(const n of npcs){const d=dist(player,n);if(d<bd)best=n,bd=d}if(bd>190){say('Nothing nearby to interact with.');return}if(best.type){if(best.type==='masjid')say('Al-Huda Masjid: salah, Qur’an, classes, elders, youth, families and community life.');else if(best.type==='market'){if(player.cash>=18){player.cash-=18;player.stress-=2;player.health=Math.min(100,player.health+2);say('You bought groceries. -$18.');}else say('You cannot afford groceries today.')}else if(best.type==='library'||best.type==='college')study();else if(best.type==='job')work();else if(best.type==='community'){player.trust+=2;player.relationship+=2;player.reputation+=1;say('You spent an ordinary hour with the community. Ordinary hours build lives.')}else if(best.type==='clinic'){player.cash=Math.max(0,player.cash-30);player.health=Math.min(100,player.health+20);say('A clinic visit cost $30 and improved your health.')}else say(`You are at ${best.name}.`)}else{best.trust=clamp(best.trust+3,0,100);player.relationship=clamp(player.relationship+2,0,100);player.reputation=clamp(player.reputation+.8,0,100);say(`You talked with ${best.name}, a ${best.job}. They will remember how you treated them.`)}}
function update(dt){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(Math.hypot(dx,dy)){const l=Math.hypot(dx,dy);player.x+=dx/l*230*dt;player.y+=dy/l*230*dt;player.energy=Math.max(0,player.energy-dt*.35)}player.x=clamp(player.x,80,world.w-80);player.y=clamp(player.y,80,world.h-80);advance(dt*2.1);for(const n of npcs){if(Math.random()<.01){n.tx=clamp(n.x+(Math.random()-.5)*600,80,2520);n.ty=clamp(n.y+(Math.random()-.5)*600,80,1720)}const a=Math.atan2(n.ty-n.y,n.tx-n.x);const d=Math.hypot(n.tx-n.x,n.ty-n.y);if(d>8){n.x+=Math.cos(a)*n.speed*dt;n.y+=Math.sin(a)*n.speed*dt}}camera.x=clamp(player.x-W/2,0,world.w-W);camera.y=clamp(player.y-H/2,0,world.h-H);autosave+=dt;if(autosave>45){save();autosave=0}render();updateUI()}
function drawBuilding(b){const p=screen(b);ctx.fillStyle=b.type==='masjid'?'#303f5a':'#26303d';ctx.fillRect(p.x,p.y,b.w,b.h);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.strokeRect(p.x,p.y,b.w,b.h);if(b.type==='masjid'){ctx.fillStyle='#c9d2e8';ctx.fillRect(p.x+b.w/2-10,p.y-42,20,42);ctx.beginPath();ctx.arc(p.x+b.w/2,p.y-45,14,Math.PI,0);ctx.fill();ctx.fillStyle='#f0f3fa';ctx.fillRect(p.x+25,p.y+35,b.w-50,16)}ctx.fillStyle='#dfe6f5';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(b.name,p.x+b.w/2,p.y+b.h+18)}
function render(){ctx.fillStyle='#0b1018';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(0,0);ctx.fillStyle='#111a22';ctx.fillRect(-camera.x,-camera.y,world.w,world.h);for(const r of roads){const p=screen(r);ctx.fillStyle='#202a33';ctx.fillRect(p.x,p.y,r.w,r.h);ctx.strokeStyle='rgba(255,255,255,.04)';for(let q=0;q<(r.w>r.h?r.w:r.h);q+=80){if(r.w>r.h)ctx.fillRect(p.x+q,p.y+r.h/2,40,2);else ctx.fillRect(p.x+r.w/2,p.y+q,2,40)}}for(const t of trees){const p=screen(t);ctx.fillStyle='#1e4937';ctx.beginPath();ctx.arc(p.x,p.y,t.r,0,Math.PI*2);ctx.fill()}for(const h of homes)drawBuilding(h);for(const b of buildings)drawBuilding(b);for(const n of npcs){const p=screen(n);ctx.fillStyle=n.mood>70?'#8fc8aa':'#a7b0c4';ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.65)';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(n.name,p.x,p.y-16)}const pp=screen(player);ctx.fillStyle='#9b7cff';ctx.beginPath();ctx.arc(pp.x,pp.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('YOU',pp.x,pp.y-22);ctx.restore();const light=(Math.sin((world.hour/24)*Math.PI*2-Math.PI/2)+1)/2;ctx.fillStyle=`rgba(6,10,20,${.38*(1-light)})`;ctx.fillRect(0,0,W,H)}
function updateUI(){const s=document.getElementById('stats');const bar=(n,v)=>`<span class="pill">${n} <span class="bar"><i style="width:${clamp(v,0,100)}%"></i></span></span>`;s.innerHTML=`<span class="pill">DAY ${world.day} · ${timeStr()}</span><span class="pill">${prayerName()}</span>${bar('ENERGY',player.energy)}${bar('HEALTH',player.health)}<span class="pill">$${Math.round(player.cash)}</span>`;document.getElementById('panelBody').innerHTML=`<div class="row"><b>Current action</b><span>${message}</span></div><div class="row"><span>Health</span><b>${Math.round(player.health)}</b></div><div class="row"><span>Energy</span><b>${Math.round(player.energy)}</b></div><div class="row"><span>Stress</span><b>${Math.round(player.stress)}</b></div><div class="row"><span>Discipline</span><b>${Math.round(player.discipline)}</b></div><div class="row"><span>Knowledge</span><b>${Math.round(player.knowledge)}</b></div><div class="row"><span>Reputation</span><b>${Math.round(player.reputation)}</b></div><div class="row"><span>Prayer consistency</span><b>${Math.round(player.prayer)}</b></div><div class="row"><span>Community trust</span><b>${Math.round(player.trust)}</b></div><div class="row"><span>Relationships</span><b>${Math.round(player.relationship)}</b></div><div class="row"><span>Cash</span><b>$${Math.round(player.cash)}</b></div><div class="row"><span>Debt</span><b>$${Math.round(player.debt)}</b></div><p class="muted">Life in THE PATH is systemic. People remember. Time passes. Worship, work, family, money, health and reputation pull on one another.</p>`}
function togglePanel(){panel=!panel;document.getElementById('panel').classList.toggle('open',panel)}function save(){localStorage.setItem('THE_PATH_SAVE',JSON.stringify({world,player}));say('Saved. Your path continues.')}function load(){const x=localStorage.getItem('THE_PATH_SAVE');if(!x){say('No save exists yet.');return}const d=JSON.parse(x);Object.assign(world,d.world);Object.assign(player,d.player);say('Save restored.')}
document.getElementById('menuBtn').onclick=togglePanel;document.getElementById('saveBtn').onclick=save;
// mobile joystick
let joy=false;const j=document.getElementById('joy'),st=document.getElementById('stick');function joyMove(e){const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy;const m=Math.hypot(x,y),lim=42;if(m>lim){x=x/m*lim;y=y/m*lim}st.style.transform=`translate(${x}px,${y}px)`;keys.a=x<-12;keys.d=x>12;keys.w=y<-12;keys.s=y>12}j.addEventListener('pointerdown',e=>{joy=true;j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',e=>{if(joy)joyMove(e)});j.addEventListener('pointerup',()=>{joy=false;st.style.transform='';keys.a=keys.d=keys.w=keys.s=false});
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)}
load();say('Welcome to THE PATH. Life is already happening.'); if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{}); requestAnimationFrame(loop);
</script></body></html>
